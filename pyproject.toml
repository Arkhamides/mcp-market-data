[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-market-data"
version = "0.1.1"
description = "MCP server for streaming crypto market data via WebSocket"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "arkhamides", email = "joearchondis@gmail.com"}
]
license = {text = "MIT"}
keywords = ["mcp", "market-data", "websocket", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.1.0",
    "websockets>=12.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
]

[project.urls]
Homepage = "https://github.com/arkhamides/mcp-market-data"
Repository = "https://github.com/arkhamides/mcp-market-data"
Documentation = "https://github.com/arkhamides/mcp-market-data#readme"

[project.scripts]
ark-market-data-mcp = "ark_market_data_mcp.stdio_server:main"
ark-market-data-mcp-http = "ark_market_data_mcp.http_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ark_market_data_mcp*"]
